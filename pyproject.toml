[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agent-swarm-eval-arena"
version = "0.2.0"
description = "Multi-agent evaluation arena: benchmark and compare agent strategies on coordination tasks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []  # pure stdlib

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
